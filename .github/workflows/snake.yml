name: Gera animação da cobrinha (snake)

on:
  schedule:
    # roda todo dia à meia-noite (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main # roda também sempre que você der push na main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar o GIF/SVG da cobrinha
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: pccardoso
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4285f4,#3367d6

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
